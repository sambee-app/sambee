services:
  devcontainer:
    build:
      context: ..
      dockerfile: Dockerfile
      target: devcontainer
    volumes:
      - ..:/workspace:cached
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - /proc/cpuinfo:/host/proc/cpuinfo:ro
      - /sys:/host/sys:ro
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      - vscode-extensions-insiders:/home/vscode/.vscode-server-insiders/extensions
      - node_modules:/workspace/frontend/node_modules
      - pip-cache:/home/vscode/.cache/pip
      - cargo-registry:/home/vscode/.cargo/registry
      - cargo-git:/home/vscode/.cargo/git
      - cargo-advisory-db:/home/vscode/.cargo/advisory-db
      - cargo-tools:/home/vscode/.local/cargo-tools
    command: sleep infinity
    environment:
      - TZ=UTC
    network_mode: host  # Easier for SMB testing

volumes:
  vscode-extensions:
  vscode-extensions-insiders:
  node_modules:
  pip-cache:
  cargo-registry:
  cargo-git:
  cargo-advisory-db:
  cargo-tools:
