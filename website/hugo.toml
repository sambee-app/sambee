baseURL = "https://sambee.net/"
title = "Sambee"
theme = "sambee"
defaultContentLanguage = "en"
enableRobotsTXT = true
ignoreFiles = ["(^|/)inherit\\.md$", "(^|/)_inherit\\.md$"]

[pagination]
pagerSize = 10

[build]
  [build.buildStats]
    enable = true
    disableIDs = true
    disableTags = true

[outputs]
home = ["HTML", "DocsRoutes"]
section = ["HTML"]
page = ["HTML"]

[outputFormats.DocsRoutes]
mediaType = "application/json"
baseName = "docs-routes"
isPlainText = true
notAlternative = true

[imaging]
resampleFilter = "Lanczos"

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[caches]
  [caches.images]
    dir = ":resourceDir/_gen"
    maxAge = "8760h"

  [caches.assets]
    dir = ":resourceDir/_gen"
    maxAge = "720h"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    codeFences = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
