  kicker: "COMPARE // FILESTASH ALTERNATIVE"
  title: Stop using a cloud adapter to manage your SMB shares.
  lead: >-
    Filestash connects to 25 protocols at surface depth—and locks OIDC single sign-on, audit logs, and early security patches behind monthly subscriptions. Sambee is purpose-built for SMB shares and local drives, with defense-in-depth security, dual-pane navigation, native desktop app editing, and free SSO under the MIT license.
