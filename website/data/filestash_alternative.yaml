pillars:
  enabled: true
  id: pillars
  eyebrow: ARCHITECTURAL DIFFERENCES
  title: Four Reasons Teams Switch to Sambee
  intro: >-
    How Sambee's open license, security model, and focus on SMB and local drives pay off in practice.
  chapters:
    - eyebrow: LICENSING & IDENTITY
      title: 'Zero "SSO Tax." Permissive MIT Open Source.'
      lead: >-
        Authentication should never sit behind a monthly subscription. Filestash restricts OIDC, RBAC, proxy auth, and environment-variable config to paid plans.
      points:
        - "**Free OIDC everywhere**: Connect Keycloak, Authentik, Authelia, Okta, or any standard OIDC provider at zero cost."
        - "**Automatic group roles**: Map identity-provider groups directly to Administrator, Editor, and Viewer roles."
        - "**Safe staged rollout**: Test OIDC beside local passwords, then switch to passwordless OIDC-only sign-in."

    - eyebrow: DEFENSE-IN-DEPTH SECURITY
      title: Hardened From Wire Protocol to Container Image.
      lead: >-
        A web file manager sits directly in front of sensitive shares. Sambee builds enterprise credential hygiene and supply-chain verification into every release.
      points:
        - "**Encrypted, authenticated SMB**: Enforce Kerberos-only sign-in, mandatory message signing, and SMB3 transport encryption."
        - "**Revocable server sessions**: Keep credentials out of cookies and URLs, revoke sessions individually, and validate proxy CIDRs."
        - "**Verified supply chain**: Deploy non-root images signed with Cosign, backed by SBOMs, `--require-hashes`, and weekly Trivy scans."

    - eyebrow: SMB & LOCAL STORAGE DEPTH
      title: Instantaneous Navigation Across NAS and PC Disks.
      lead: >-
        Funneling 25 cloud APIs through one minimal adapter reduces every backend to basic list and read calls. Focusing on SMB and local drives makes both fast.
      points:
        - "**Live directory updates**: Subscribe to SMB2/SMB3 `CHANGE_NOTIFY` events so open folders refresh in real time."
        - "**Millisecond folder jumps**: Press `Ctrl+K` to navigate instantly to the any folder."
        - "**Local drives in one tab**: Pair the optional Companion app to transfer files straight between your PC and NAS."

    - eyebrow: WORKFLOWS & OPERATIONS
      title: Native Desktop Apps in One Lightweight Container.
      lead: >-
        Running a multi-gigabyte Collabora server just to edit a document wastes resources and still cannot open Photoshop, Illustrator, or desktop tools.
      points:
        - "**Commander ergonomics**: Use dual-pane mode, browse inside ZIP archives without extraction, and use touch bars on mobile."
        - "**Real desktop editing**: Edit files in Word, Excel, LibreOffice, or Photoshop with server-side edit locks."
        - "**Operational simplicity**: Single container with auto-saved settings and built-in CPU, RAM, and thermal health monitoring."

