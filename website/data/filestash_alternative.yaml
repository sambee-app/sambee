fit:
  enabled: true
  id: fit
  eyebrow: DECISION GUIDE
  title: Choose the Right Tool for Your Infrastructure
  intro: >-
    Filestash and Sambee solve different problems. Check which tool matches your setup before you compare individual features.
  sambee:
    title: Switch to Sambee if you want...
    items:
      - "**First-class access to SMB shares and local drives**—browse Windows file servers, NAS shares, and the drives on your own computer in one workspace."
      - "**Enterprise security without paywalls**, including free OIDC single sign-on, Kerberos, SMB3 encryption, and signed Docker images."
      - "**Dual-pane file management**, instant folder navigation, ZIP archive inspection, and dedicated mobile controls."
      - "**Native desktop editing** in Word, Excel, LibreOffice, or Photoshop without running a Collabora WOPI server."
  competitor:
    title: Keep Filestash if you need...
    items:
      - "**Multi-cloud protocol breadth** across S3, Backblaze B2, MinIO, FTP/SFTP, Dropbox, Google Drive, or Git."
      - "**Outbound protocol gateways** that re-expose storage as SFTP, WebDAV, S3, or MCP endpoints."
      - "**Public anonymous share links** for external guests without accounts on your network."

