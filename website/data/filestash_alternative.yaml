hero:
  enabled: true
  kicker: SAMBEE VS. FILESTASH
  title: "Sambee: The Filestash Alternative for SMB Shares & Local Drives"
  lead: >-
    Sambee replaces Filestash's 25-protocol cloud adapter and paywalled SSO with a fast, MIT-licensed workspace built for SMB shares and local drives—complete with free OIDC single sign-on, Kerberos security, dual-pane browsing, and native desktop app editing.
  ctas:
    - id: hero-jump-matrix
      label: "Comparison Matrix ↓"
      kind: secondary
      target:
        type: anchor
        id: comparison
  scorecard:
    aria_label: Sambee vs. Filestash key differences
    rows:
      - label: LICENSE & COST
        value: MIT Open Source
        contrast: "$0 forever, unlimited users (vs. $50–$290/mo tiers)"
      - label: SINGLE SIGN-ON
        value: Free OIDC + Group Roles
        contrast: "Included for all providers (vs. paywalled SSO & RBAC)"
      - label: SMB SECURITY
        value: Kerberos & SMB3 Encryption
        contrast: "Plus mandatory signing (vs. NTLM/Guest only)"
      - label: FOOTPRINT & EDITING
        value: 1 Hardened Container
        contrast: "Native desktop apps (vs. heavy Collabora sidecar)"

