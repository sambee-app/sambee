test_drive:
  enabled: true
  id: test-drive
  eyebrow: 5-MINUTE EVALUATION
  title: Test Sambee Beside Filestash
  body: >-
    Sambee connects directly to the files already on your SMB server. Keep Filestash on port 8334, start Sambee on port 8000, and compare them against the same share.
  assurances:
    - Leaves your existing files, folders, and share permissions untouched.
    - Requires zero file import, syncing, or database migration.
    - Stops cleanly at any time with zero changes left on your share.
  ctas:
    - id: test-drive-deploy-guide
      label: Deployment Guide
      kind: primary
      target:
        type: docs
        book: admin-guide
        section: installation-and-deployment
        page: deploy-sambee-with-docker
    - id: test-drive-github
      label: View on GitHub
      kind: secondary
      href: https://github.com/sambee-app/sambee
  code_filename: docker-compose.yml
  code_lang: yaml
  code: |
    services:
      sambee:
        image: ghcr.io/sambee-app/sambee:stable
        restart: unless-stopped
        volumes:
          - ./data:/app/data
        ports:
          - 8000:8000

faq:
  enabled: true
  id: faq
  eyebrow: TECHNICAL FAQ
  title: Common Questions from Filestash Evaluators
  items:
    - question: Is OIDC single sign-on really free in Sambee?
      answer: >-
        Yes. Sambee uses the permissive MIT license with no paid tiers or seat limits. OIDC sign-in, group-based role assignment, and all SMB security features are free for personal and commercial use.

    - question: Do I have to migrate or import my files from Filestash?
      answer: >-
        No. Sambee connects directly to your Windows File Server, NAS, or Samba shares over SMB2/SMB3. Your folders, filenames, and permissions stay untouched, and both tools can run side by side during evaluation.

    - question: How do users edit Office documents without Collabora or OnlyOffice?
      answer: >-
        Desktop users pair the optional Sambee Companion app and press `Ctrl+Enter` to open files in Microsoft Word, Excel, LibreOffice, Photoshop, or any installed application. Sambee locks the file on the share, checks for conflicts, and saves changes straight back. Built-in browser editors handle Markdown, code, and plain text.

    - question: Do phones and tablets need the Companion app?
      answer: >-
        No. Phones, tablets, and browser-only computers connect directly to Sambee over HTTPS with zero client installation. Companion is optional and used only on desktops that want local-drive browsing or native app launching.

    - question: How does Sambee's security model differ from Filestash?
      answer: >-
        Sambee includes every security control in the free open-source release: Kerberos authentication, mandatory SMB signing, SMB3 encryption, revocable server-side sessions without credentials in cookies or URLs, CIDR-verified proxy headers, login rate limits, and Cosign-signed images with SBOMs and weekly Trivy scans.

    - question: Why doesn't Sambee support S3, FTP, or Google Drive?
      answer: >-
        Focus. Supporting 25 cloud APIs limits every backend to basic file operations. Focusing exclusively on SMB2/SMB3 shares and local drives lets Sambee deliver Kerberos, SMB3 encryption, live `CHANGE_NOTIFY` updates, instant SQLite folder search, streaming ZIP folders, and native desktop save-back.
