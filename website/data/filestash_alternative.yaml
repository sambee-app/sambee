        contrast: "(vs. AGPLv3 + $50–$290/mo tiers)"
      - label: IDENTITY & ACCESS
        value: Free OIDC SSO + IdP group roles
        contrast: "(vs. paywalled SSO & RBAC)"
      - label: SMB SECURITY
        value: Kerberos + signing + SMB3 encryption
        contrast: "(vs. NTLM/Guest only)"
