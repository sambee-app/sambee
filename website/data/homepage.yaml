meta:
  slug: home
  title: Sambee

hero:
  enabled: true
  kicker: Free and Open Source Software Designed for Self-Hosting
  title: SMB and local files, in your browser
  subtitle: Turn your storage into a modern workspace—no migration, syncing, or cloud required.
  ctas:
    - id: hero-primary
      label: Deploy with Docker
      kind: primary
      target:
        type: docs
        book: admin-guide
        section: installation-and-deployment
        page: deploy-sambee-with-docker

problem_value:
  enabled: true
  items:
    - id: value1
      icon: cloud_lock
      eyebrow: No Lock-In
      title: Use the storage you have
      body: >-
        Connect to the Windows file servers, NAS devices, and local drives you already use. No syncing, re-indexing, or proprietary database.
    - id: value2
      icon: laptop_windows
      eyebrow: Seamless Workflows
      title: Edit in your apps
      body: >-
        Open files in Word, Photoshop, and other installed apps. When you save, changes go straight back to the original share.
    - id: value3
      icon: verified_user
      eyebrow: Security & Control
      title: "SSO: Your permissions"
      body: >-
        Use OIDC single sign-on while Sambee honors your existing Windows or Linux/POSIX permissions.

ui_screenshot:
  enabled: true
  preview_image:
    src: images/home/sambee-screenshot.png
    dark_src: images/home/sambee-screenshot-dark.png
    alt: Screenshot of the Sambee main web interface

benefits:
  enabled: true
  eyebrow: Why Sambee
  title: Benefits
  items:
    - id: self_hosted_control
      icon: shield_lock
      marker: 01 // OWNERSHIP
      title: Self-hosted control
      body: Keep file access in your own environment instead of routing everyday file handling through cloud storage.
    - id: better_file_handling
      icon: dynamic_form
      marker: 02 // NAVIGATION
      title: Better file handling
      body: Browse large SMB directories with search, keyboard shortcuts, dual-pane navigation, and instant navigation to any directory.
    - id: rich_previews
      icon: image_search
      marker: 03 // PREVIEW
      title: Rich previews
      body: View images, PDFs, and Markdown directly in the browser, including formats browsers do not handle well on their own.
    - id: native_editing
      icon: edit_square
      marker: 04 // EDITING
      title: Native editing
      body: Open files in Word, Photoshop, LibreOffice, and other installed desktop apps through Sambee Companion.
    - id: built_for_desktop_and_mobile
      icon: devices
      marker: 05 // MOBILITY
      title: Built for desktop & mobile
      body: Use the same system from a workstation, tablet, or phone without giving up core functionality.
    - id: fits_existing_infrastructure
      icon: hub
      marker: 06 // INTEGRATION
      title: Fits existing infrastructure
      body: Deploy with Docker, place it behind your reverse proxy, and connect it to the SMB storage you already use.

features:
  enabled: true
  id: features
  eyebrow: What Sambee Does
  title: Features
  groups:
    - id: access
      icon: folder_managed
      title: Access
      summary: One interface for the storage you already run.
      items:
        - title: SMB shares
          body: Connect to Windows file servers, NAS devices, Samba servers, and other SMB-compatible storage.
        - title: Local drives
          body: Connect to local drives (requires the optional Sambee Companion app).
    - id: identity_access
      icon: shield_person
      title: Identity & permissions
      summary: Your identity provider. Your access rules.
      items:
        - title: OIDC single sign-on
          body: Connect Sambee to your OIDC identity provider, including Keycloak and Authelia.
        - title: Roles from your IdP
          body: Admit users and assign Administrator, Editor, or Viewer roles from identity-provider groups.
        - title: Easy, secure rollout
          body: Start with OIDC alongside local passwords, then switch to passwordless OIDC-only sign-in when ready.
    - id: navigate
      icon: route
      title: Navigate
      summary: Move through large file trees without digging through folders.
      items:
        - title: Single-pane and dual-pane layouts
          body: Switch between focused browsing and side-by-side workflows depending on whether you are reviewing, comparing, or moving files.
        - title: Efficient keyboard navigation
          body: Move through large file trees faster with keyboard-first controls built for speed and efficiency.
        - title: Instant navigation to any directory
          body: Jump straight to your target folder instead of having to remember and navigate complex directory hierarchies.
    - id: preview
      icon: pageview
      title: Preview
      summary: Inspect many types of files directly in the browser.
      items:
        - title: Fast swiping through images
          body: Move quickly even through large image sets with a fast and responsive viewer.
        - title: Desktop and mobile-friendly viewing
          body: Viewing, browsing, and searching files feels natural on both desktop and mobile devices.
        - title: PDF search
          body: Search inside PDF documents to quickly find specific content.
    - id: markdown
      icon: markdown
      title: Markdown
      summary: View, search, and edit Markdown files without opening another app.
      items:
        - title: First-class Markdown support
          body: Full Markdown support for rendering, searching, and editing without needing to switch into a separate editor.
        - title: View and edit
          body: View Markdown files with rich formatting, seamlessly switch to editing mode when needed.
        - title: WYSIWYG table editing
          body: Edit tables directly in the rendered view.
    - id: text_code
      icon: code
      title: Text and code
      summary: View and edit text and code files in the embedded editor.
      items:
        - title: Professional editor
          body: Built on CodeMirror, a feature-rich, fast, and mature browser-based editor.
        - title: Syntax highlighting
          body: Support for many formats and file types.
    - id: file_management
      icon: drive_file_move
      title: File management
      summary: Handle the everyday file operations that normally force users back to desktop file managers.
      items:
        - title: Rename, delete, upload, and download
          body: Take care of common file and folder operations from one browser interface.
        - title: Copy and move across storage locations
          body: Move files and folders between local drives and SMB shares.
        - title: Inspect, create, and extract ZIP archives
          body: Archives are virtual folders you can move around in. Files from within archives can be viewed directly without a need to extract them first.
    - id: desktop_app_editing
      icon: open_in_new
      title: Edit in desktop apps
      summary: Open and edit any file in its installed desktop application directly from your browser.
      items:
        - title: Native editing via Sambee Companion
          body: Open files in Word, Photoshop, LibreOffice, and other installed desktop apps directly from Sambee.
        - title: Save back to source location
          body: Sambee collects edited files from the desktop app and saves them back to their source location.
        - title: Conflict handling and recovery
          body: Never lose work with built-in conflict handling.
    - id: ui_themes
      icon: palette
      title: UI themes
      summary: Choose between different themes or create your own to make the user interface your own.
      items:
        - title: Adjustable interface appearance
          body: Tune Sambee's UI to your preferences and environments with themes.
        - title: Included light and dark themes
          body: Choose between friendly light and dark themes, designed to be easy on the eyes.
    - id: speed_and_efficiency
      icon: bolt
      title: Speed and efficiency
      summary: Support fast day-to-day browsing by keeping the underlying system efficient as well as the interface.
      items:
        - title: Optimized SMB protocol implementation
          body: Modern SMB protocol implementation optimized for high throughput and low latency.
        - title: Low resource requirements
          body: Sambee requires only a single Docker container and runs efficiently even on smaller machines.
        - title: On-the-fly format conversions
          body: Sambee converts files only when needed while previewing them in the browser.

preview_support:
  enabled: true
  eyebrow: Broad file type support
  title: Viewers & Editors
  body: >-
    Sambee supports in-browser previewing and/or editing for a broad range of file types,
    including images, PDFs, and Markdown.
  supporting_link:
    id: preview-support
    label: See full viewer support →
    target:
      type: docs
      book: user-guide
      section: reference
      page: supported-file-formats
  groups:
    - title: Classic image formats
      icon: image
      formats:
        - label: JPG
          detail: JPEG interchange format
        - label: PNG
          detail: Portable Network Graphics
        - label: GIF
          detail: Graphics Interchange Format
        - label: SVG
          detail: Scalable Vector Graphics
        - label: BMP
          detail: Bitmap image format
        - label: ICO
          detail: Windows icon resource
    - title: Modern image formats
      icon: image
      formats:
        - label: HEIC
          detail: High Efficiency Image Container
        - label: JXL
          detail: JPEG XL container
        - label: AVIF
          detail: AV1 image file format
        - label: WEBP
          detail: Google WebP image format
    - title: Professional graphics
      icon: image
      formats:
        - label: PSD
          detail: Adobe Photoshop document
        - label: AI
          detail: Adobe Illustrator artwork
        - label: EPS
          detail: Encapsulated PostScript
        - label: TIFF
          detail: Tagged Image File Format
    - title: Documents
      icon: description
      formats:
        - label: PDF
          detail: Portable Document Format
        - label: MD
          detail: CommonMark-compatible text
    - title: Config & data files
      icon: data_object
      formats:
        - label: YAML
          detail: YAML Ain't Markup Language
        - label: INI
          detail: Initialization file format
        - label: JSON
          detail: JavaScript Object Notation
        - label: TOML
          detail: Tom's Obvious Minimal Language
        - label: XML
          detail: Extensible Markup Language
    - title: Code files
      icon: code
      formats:
        - label: JS/TS
          detail: JavaScript / TypeScript
        - label: HTML
          detail: Hypertext Markup Language
        - label: CSS
          detail: Cascading Style Sheets
        - label: PY
          detail: Python
        - label: SH
          detail: Bash

companion:
  enabled: true
  eyebrow: Companion App
  title: Extend Sambee to the local desktop
  body: >-
    The companion app extends Sambee to the local desktop, connecting
    Sambee to local drives and enabling native desktop editing.
  bullets:
    - access local drives
    - open files in installed desktop applications
    - return edited files to the source location
  preview_image:
    src: images/home/companion-screenshot.png
    alt: Screenshot of the Sambee Companion application
  note_title: COM-04 // Deployment Note
  note_body: Companion is optional for browser-based use, but required for local-drive access and native desktop-app editing.
  cta:
    id: companion-primary
    label: Install Companion
    kind: primary
    target:
      type: docs
      book: user-guide
      section: companion-app
      page: install-and-pair-the-companion-app

deployment:
  enabled: true
  title: Self-hosted and easy to fit
  body: >-
    Sambee is designed for environments that care about control. Deploy it
    with Docker, run it behind your reverse proxy, and connect it to the SMB
    storage you already use.
  secondary_body: >-
    The goal is to make the storage you already trust easier to access from
    the browser.
  cta:
    id: deployment-primary
    label: Single-Container Architecture
    kind: secondary
    target:
      type: docs
      book: admin-guide
      section: overview-and-planning
      page: architecture-overview

proof:
  enabled: true
  eyebrow: Designed for control
  title: Built for your environment
  body: Sambee is designed for environments that value control, inspectability, and infrastructure fit.
  status_label: INFRA_MAP // STABLE_READY
  items:
    - category: SOHO
      label: NAS devices & Samba servers
    - category: Protocol Support
      label: SMB2 & SMB3
    - category: Enterprise
      label: Windows file servers
    - category: Client Access
      label: Desktop & mobile browsers
    - category: Installation
      label: Self-hosted deployments
    - category: Governance
      label: Open-source codebase
