services:
  sambee:
    image: ghcr.io/sambee-app/sambee:stable
    restart: unless-stopped
    volumes:
      - ./data:/app/data

      # Optional: Mount config.toml if you want to customize settings by uncommenting the line below
      # - ./config.toml:/app/config.toml:ro

      # Optional: Read-only Linux host mounts for host memory, normalized load, and CPU temperature monitoring
      # - /proc/meminfo:/host/proc/meminfo:ro
      # - /proc/loadavg:/host/proc/loadavg:ro
      # - /proc/cpuinfo:/host/proc/cpuinfo:ro
      # - /sys:/host/sys:ro

    ports:
      - 8000:8000
