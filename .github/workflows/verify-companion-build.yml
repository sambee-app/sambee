name: Verify Companion Build

on:
  pull_request:
    paths:
      - companion/**
      - VERSION
      - scripts/sync-version
      - scripts/check_tauri_version_alignment.py
      - .github/actions/sync-version-check/**
      - .github/workflows/verify-companion-build.yml
      - companion/package-lock.json
      - companion/tsconfig.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      requires-build: ${{ steps.scope.outputs.requires-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: scope
        name: Determine whether a package build is required
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "requires-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          requires_build="$(python3 .github/scripts/companion_build_required.py \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          echo "requires-build=$requires_build" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: change-scope
    if: needs.change-scope.outputs.requires-build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/sync-version-check

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        run: cd companion && npm ci

      - name: Run Companion checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force companion/recovery-report | Out-Null
          @{ source_sha = '${{ github.sha }}'; run_id = '${{ github.run_id }}'; target = 'windows-x64' } |
            ConvertTo-Json | Set-Content companion/recovery-report/source.json
          cd companion
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'Companion TypeScript check failed.' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Companion lint failed.' }
          cd src-tauri
          cargo test
          if ($LASTEXITCODE -ne 0) { throw 'Native Rust tests failed.' }
          cargo test --features recovery-verification server::directory_manager::tests -- --test-threads=2 2>&1 |
            Tee-Object -FilePath ../recovery-report/native-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Native recovery tests failed.' }

      - name: Assert verification-only secret boundary
        shell: pwsh
        run: |
          foreach ($name in @('TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_TENANT_ID')) {
            if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
              throw "$name must be unset for verification-only builds."
            }
          }
          $isFork = '${{ github.event_name }}' -eq 'pull_request' -and '${{ github.event.pull_request.head.repo.full_name }}' -ne '${{ github.repository }}'
          if ($isFork) {
            foreach ($name in @('APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'COMPANION_RELEASE_REPO_TOKEN')) {
              if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
                throw "$name must be unset for fork pull requests."
              }
            }
          }

      - name: Configure verification-only Tauri bundle
        shell: pwsh
        run: |
          $configPath = 'companion/src-tauri/tauri.conf.json'
          $env:TAURI_CI_CONFIG = Join-Path $env:RUNNER_TEMP 'tauri.verification.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config.bundle.windows.signCommand = $null
          $config | ConvertTo-Json -Depth 20 | Set-Content $env:TAURI_CI_CONFIG
          "TAURI_CI_CONFIG=$env:TAURI_CI_CONFIG" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows x64 package
        shell: pwsh
        run: |
          cd companion
          npm run tauri -- build --config $env:TAURI_CI_CONFIG --target x86_64-pc-windows-msvc --features recovery-verification --bundles nsis -v
          if ($LASTEXITCODE -ne 0) { throw 'Verification package build failed.' }

      - name: Run packaged-process recovery smoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          python companion/scripts/recovery-smoke.py `
            --executable companion/src-tauri/target/x86_64-pc-windows-msvc/release/sambee-companion.exe `
            --report-dir companion/recovery-report `
            --source-sha '${{ github.sha }}' --run-id '${{ github.run_id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged recovery smoke test failed. Inspect recovery-report.' }

      - name: Assert updater artifacts are absent
        shell: pwsh
        run: |
          $bundlePath = 'companion/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          if (Get-ChildItem -Path $bundlePath -Recurse -Filter '*.sig' | Select-Object -First 1) {
            throw 'Verification-only build produced an updater signature artifact.'
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: companion-verification-windows-x64-${{ github.sha }}-${{ github.run_id }}
          path: |
            companion/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
            companion/src-tauri/target/x86_64-pc-windows-msvc/release/sambee-companion.exe
            companion/recovery-report/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary Tauri configuration
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:TAURI_CI_CONFIG) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:TAURI_CI_CONFIG
          }
