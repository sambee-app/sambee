name: "CI: Test"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────────────
  # Detect which components changed
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      companion: ${{ steps.filter.outputs.companion }}
      website: ${{ steps.filter.outputs.website }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Detect changed paths
      id: filter
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/ci_change_detector.py

    - name: Check changed whitespace
      env:
        DIFF_BASE: ${{ steps.filter.outputs.diff_base }}
      run: |
        set -euo pipefail
        if [[ "$DIFF_BASE" == "__empty_tree__" ]]; then
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" "$GITHUB_SHA"
          exit 0
        fi
        git fetch --no-tags --depth=1 origin "$DIFF_BASE"
        git diff --check "$DIFF_BASE" "$GITHUB_SHA"

  # ──────────────────────────────────────────────
  # Website docs: validator + standalone tests
  # ──────────────────────────────────────────────
  website-docs:
    needs: changes
    if: needs.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate docs tree
      run: python3 website/scripts/validate-docs-content.py

    - name: Check committed docs structure report
      run: python3 website/scripts/docs-report.py --check

    - name: Run standalone docs validator tests
      run: python3 -m unittest discover -s website/tests -p 'test_validate_docs_content.py'

    - name: Run standalone docs report tests
      run: python3 -m unittest discover -s website/tests -p 'test_docs_report.py'

  # ──────────────────────────────────────────────
  # Backend: Python + mypy + pytest
  # ──────────────────────────────────────────────
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Verify shared Python runtime image
      run: python3 scripts/verify-python-runtime-image.py

    - name: Verify archive live-session worker contract
      run: python3 scripts/verify-archive-single-worker.py

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build backend test image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        target: backend-test
        load: true
        tags: sambee:backend-test
        cache-from: type=gha,scope=backend-test
        cache-to: type=gha,mode=max,scope=backend-test

    - name: Run backend checks
      env:
        SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use
        ENCRYPTION_KEY: YYFPojCh_1WUExv5xXVEyFe0ITw_5dgZZ-fC-iZk3nU=
      run: |
        docker run \
          --name sambee-backend-test \
          -e SECRET_KEY \
          -e ENCRYPTION_KEY \
          sambee:backend-test \
          sh -c '
            git --version &&
            jq --version &&
            QUIET=1 scripts/setup-test-images &&
            cd backend &&
            .venv/bin/python -m mypy --cache-dir=/home/vscode/.cache/mypy app &&
            .venv/bin/python -m pytest -n auto -m "not performance" --cov=app --cov-report=term-missing --cov-report=xml &&
            .venv/bin/python -m pytest -m performance --cov=app --cov-append --cov-report=term-missing --cov-report=xml
          '

    - name: Export coverage report
      if: always()
      run: |
        mkdir -p "${{ runner.temp }}/coverage"
        docker cp sambee-backend-test:/workspace/backend/coverage.xml "${{ runner.temp }}/coverage/coverage.xml" || true

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-reports
        path: ${{ runner.temp }}/coverage/coverage.xml
        retention-days: 7
        compression-level: 6
        if-no-files-found: warn

    - name: Clean up backend test container
      if: always()
      run: docker rm -f sambee-backend-test || true

  # ──────────────────────────────────────────────
  # Frontend: Node.js + tsc + vitest
  # ──────────────────────────────────────────────
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Sync and verify version metadata
      uses: ./.github/actions/sync-version-check

    - name: Verify Tauri package version alignment
      shell: bash
      run: |
        if command -v python3 >/dev/null 2>&1; then
          python3 scripts/check_tauri_version_alignment.py
        elif command -v python >/dev/null 2>&1; then
          python scripts/check_tauri_version_alignment.py
        else
          py scripts/check_tauri_version_alignment.py
        fi

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: cd frontend && npm ci --prefer-offline

    - name: Verify frontend type correctness
      id: frontend-types
      run: cd frontend && npm run typecheck

    - name: Run tests
      run: cd frontend && npm run test:ci

    - name: Build production frontend
      run: cd frontend && npm run build

    - name: Install browser dependencies
      run: cd frontend && npm run test:e2e:install -- --with-deps

    - name: Run browser correctness contracts
      run: cd frontend && npm run test:browser:ci

    - name: Upload browser correctness reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: frontend-browser-correctness
        path: frontend/test-results/ci/
        retention-days: 7
        if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Companion: Node.js + Rust + Tauri tests
  # ──────────────────────────────────────────────
  companion:
    needs: changes
    if: needs.changes.outputs.companion == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Sync and verify version metadata
      uses: ./.github/actions/sync-version-check

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: companion/package-lock.json

    - name: Install Tauri system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: companion/src-tauri -> target

    - name: Install dependencies
      run: cd companion && npm ci --prefer-offline

    - name: TypeScript type check
      run: cd companion && npx tsc --noEmit

    - name: Run archive topology conformance checks
      run: scripts/test-archive-topology-conformance companion

  # ──────────────────────────────────────────────
  # Gate: single required check for branch protection
  # ──────────────────────────────────────────────
  test-gate:
    if: always()
    needs: [changes, backend, frontend, companion, website-docs]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout gate script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check results
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        python3 scripts/check_ci_test_gate.py
