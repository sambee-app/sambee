name: "CI: Check Backend Lockfiles"

on:
  push:
    branches: [ main ]
    paths:
      - backend/requirements.txt
      - backend/requirements-dev.txt
      - backend/requirements.lock.txt
      - backend/requirements-dev.lock.txt
      - scripts/verify-backend-lockfiles.py
      - .github/workflows/check-backend-lockfiles.yml
      - .github/actions/setup-runtime-python/**
  pull_request:
    branches: [ main ]
    paths:
      - backend/requirements.txt
      - backend/requirements-dev.txt
      - backend/requirements.lock.txt
      - backend/requirements-dev.lock.txt
      - scripts/verify-backend-lockfiles.py
      - .github/workflows/check-backend-lockfiles.yml
      - .github/actions/setup-runtime-python/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate backend lockfiles
        run: python3 scripts/verify-backend-lockfiles.py

      - name: Set up runtime Python
        uses: ./.github/actions/setup-runtime-python
        with:
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Validate hash-locked dependency resolution
        run: |
          python -m pip install --dry-run --ignore-installed --require-hashes -r backend/requirements.lock.txt
          python -m pip install --dry-run --ignore-installed --require-hashes -r backend/requirements-dev.lock.txt
