name: "Release: Promote Companion Release"

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Companion release tag, GitHub release URL, or numeric GitHub release ID
        required: true
        type: string
      companion_channel_test:
        description: Update Companion test channel feed
        required: true
        type: boolean
        default: false
      companion_channel_beta:
        description: Update Companion beta channel feed
        required: true
        type: boolean
        default: false
      companion_channel_stable:
        description: Update Companion stable channel feed
        required: true
        type: boolean
        default: false
      sambee:
        description: Update Sambee Companion feed
        required: true
        type: boolean
        default: false

env:
  COMPANION_RELEASE_REPO_OWNER: sambee-app
  COMPANION_RELEASE_REPO_NAME: sambee-companion
  COMPANION_RELEASE_REPO_BRANCH: main

concurrency:
  group: companion-release-publication
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sambee
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promote Companion release
        uses: ./.github/actions/promote-companion-release
        with:
          release-ref: ${{ inputs.release_ref }}
          companion-channel-test: ${{ inputs.companion_channel_test }}
          companion-channel-beta: ${{ inputs.companion_channel_beta }}
          companion-channel-stable: ${{ inputs.companion_channel_stable }}
          sambee: ${{ inputs.sambee }}
          release-repo-token: ${{ secrets.COMPANION_RELEASE_REPO_TOKEN }}
          release-repo-owner: ${{ env.COMPANION_RELEASE_REPO_OWNER }}
          release-repo-name: ${{ env.COMPANION_RELEASE_REPO_NAME }}
          release-repo-branch: ${{ env.COMPANION_RELEASE_REPO_BRANCH }}

  cleanup-releases:
    needs: promote
    if: ${{ needs.promote.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cleanup scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COMPANION_RELEASE_REPO_OWNER }}/${{ env.COMPANION_RELEASE_REPO_NAME }}
          ref: ${{ env.COMPANION_RELEASE_REPO_BRANCH }}
          token: ${{ secrets.COMPANION_RELEASE_REPO_TOKEN }}
          path: release-repo

      - name: Delete obsolete Companion releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.COMPANION_RELEASE_REPO_TOKEN }}
        run: |
          set -o pipefail
          python3 .github/scripts/cleanup_companion_releases.py \
            --release-repo-path "$PWD/release-repo" \
            --release-owner "${{ env.COMPANION_RELEASE_REPO_OWNER }}" \
            --release-repo "${{ env.COMPANION_RELEASE_REPO_NAME }}" | tee "$RUNNER_TEMP/companion-release-cleanup.jsonl"

      - name: Summarize Companion release cleanup
        if: always()
        shell: bash
        run: |
          cleanup_log="$RUNNER_TEMP/companion-release-cleanup.jsonl"
          {
            echo '## Companion release cleanup'
            echo
            if [[ ! -f "$cleanup_log" ]]; then
              echo 'Cleanup did not produce a classification log.'
              exit 0
            fi
            jq -r 'select(.action == "protect") | "- Keep `\(.tag_name // "untagged")`: \(.classification)"' "$cleanup_log"
            jq -r 'select(.action == "delete") | "- Delete `\(.tag_name // "untagged")`"' "$cleanup_log"
          } >> "$GITHUB_STEP_SUMMARY"
