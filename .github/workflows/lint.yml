name: "CI: Lint"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Detect which components changed
  # ─────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      companion: ${{ steps.filter.outputs.companion }}
    steps:
    - name: Detect changed paths
      id: filter
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 <<'PY'
        import json
        import os
        import sys
        import urllib.request

        output_path = os.environ["GITHUB_OUTPUT"]
        frontend_extras = {
          "VERSION",
          "scripts/sync-version",
        }
        backend_extras = {
          "Dockerfile",
          ".github/workflows/lint.yml",
          "scripts/test",
          "scripts/verify-backend-lockfiles.py",
          "scripts/verify-python-runtime-image.py",
          ".github/actions/setup-runtime-python/action.yml",
        }
        companion_extras = {
          "VERSION",
          "scripts/sync-version",
        }

        def write_output(name: str, value: bool) -> None:
            with open(output_path, "a", encoding="utf-8") as handle:
                handle.write(f"{name}={'true' if value else 'false'}\n")

        event_name = os.environ["GITHUB_EVENT_NAME"]

        if event_name == "workflow_dispatch":
            for component in ("backend", "frontend", "companion"):
                write_output(component, True)
            sys.exit(0)

        with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
            event = json.load(handle)

        headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
            "User-Agent": "sambee-ci-change-detector",
            "X-GitHub-Api-Version": "2022-11-28",
        }
        api_url = os.environ.get("GITHUB_API_URL", "https://api.github.com")
        repo = os.environ["GITHUB_REPOSITORY"]

        filenames: list[str] = []

        if event_name == "pull_request":
            pull_request = event.get("pull_request")
            if not pull_request:
                raise SystemExit("pull_request event payload is missing pull_request data")

            page = 1
            while True:
                request = urllib.request.Request(
                    f"{api_url}/repos/{repo}/pulls/{pull_request['number']}/files?per_page=100&page={page}",
                    headers=headers,
                )
                with urllib.request.urlopen(request) as response:
                    files = json.load(response)

                if not files:
                    break

                filenames.extend(file["filename"] for file in files)
                if len(files) < 100:
                    break
                page += 1
        elif event_name == "push":
            before = event.get("before")
            after = os.environ["GITHUB_SHA"]
            if not before or set(before) == {"0"}:
                for component in ("backend", "frontend", "companion"):
                    write_output(component, True)
                print("Push event is missing a valid 'before' SHA; running all components")
                sys.exit(0)

            request = urllib.request.Request(
                f"{api_url}/repos/{repo}/compare/{before}...{after}",
                headers=headers,
            )
            with urllib.request.urlopen(request) as response:
                compare = json.load(response)

            filenames.extend(file["filename"] for file in compare.get("files", []))
        else:
            raise SystemExit(f"Unsupported event for change detection: {event_name}")

        backend = any(name.startswith("backend/") or name.endswith(".py") or name in backend_extras for name in filenames)
        frontend = any(name.startswith("frontend/") or name in frontend_extras for name in filenames)
        companion = any(name.startswith("companion/") or name in companion_extras for name in filenames)

        print(f"Detected {len(filenames)} changed files")
        print(f"backend={backend} frontend={frontend} companion={companion}")

        write_output("backend", backend)
        write_output("frontend", frontend)
        write_output("companion", companion)
        PY

  # ─────────────────────────────────────────────────────────────────────
  # Backend: Python (ruff check + ruff format --check)
  # ─────────────────────────────────────────────────────────────────────
  lint-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up runtime Python
      uses: ./.github/actions/setup-runtime-python
      with:
        cache: 'pip'
        cache-dependency-path: 'backend/requirements*.txt'

    - name: Install backend lint dependencies
      run: pip install --require-hashes -r backend/requirements-dev.lock.txt

    - name: Ruff check
      run: cd backend && ruff check app tests/test_verify_backend_lockfiles_script.py ../scripts/verify-backend-lockfiles.py

    - name: Ruff executable-script check
      run: python -m ruff check --select EXE . .github

    - name: Ruff format check
      run: cd backend && ruff format --check app tests/test_verify_backend_lockfiles_script.py ../scripts/verify-backend-lockfiles.py

  # ─────────────────────────────────────────────────────────────────────
  # Frontend: TypeScript/JavaScript (biome check)
  # ─────────────────────────────────────────────────────────────────────
  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Sync and verify version metadata
      uses: ./.github/actions/sync-version-check

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Node.js dependencies
      run: cd frontend && npm ci --prefer-offline

    - name: Biome check
      run: cd frontend && npm run lint

  # ─────────────────────────────────────────────────────────────────────
  # Companion: Rust (clippy + rustfmt) + TypeScript/CSS (biome)
  # ─────────────────────────────────────────────────────────────────────
  lint-companion:
    needs: changes
    if: needs.changes.outputs.companion == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Sync and verify version metadata
      uses: ./.github/actions/sync-version-check

    - name: Verify Tauri package version alignment
      shell: bash
      run: |
        if command -v python3 >/dev/null 2>&1; then
          python3 scripts/check_tauri_version_alignment.py
        elif command -v python >/dev/null 2>&1; then
          python scripts/check_tauri_version_alignment.py
        else
          py scripts/check_tauri_version_alignment.py
        fi

    - name: Install Tauri system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: clippy, rustfmt

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: companion/src-tauri -> target

    - name: Clippy check
      run: cd companion/src-tauri && cargo clippy --lib --tests -- -D warnings

    - name: Rustfmt check
      run: cd companion/src-tauri && cargo fmt --check

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: companion/package-lock.json

    - name: Install companion Node.js dependencies
      run: cd companion && npm ci --prefer-offline

    - name: Biome check
      run: cd companion && npm run lint

  # ─────────────────────────────────────────────────────────────────────
  # Gate: single required check for branch protection
  # ─────────────────────────────────────────────────────────────────────
  node-runtime-contract:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Verify coordinated Node.js runtime
      run: python3 scripts/verify-node-runtime.py

  lint-gate:
    if: always()
    needs: [lint-backend, lint-frontend, lint-companion, node-runtime-contract]
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      run: |
        results="${{ needs.lint-backend.result }} ${{ needs.lint-frontend.result }} ${{ needs.lint-companion.result }} ${{ needs.node-runtime-contract.result }}"
        for r in $results; do
          if [[ "$r" != "success" && "$r" != "skipped" ]]; then
            echo "Job failed or was cancelled: $r"
            exit 1
          fi
        done
        echo "All lint checks passed or were skipped."
