[package]
name = "sambee-companion"
version = "2.0.10"
edition = "2021"
description = "Sambee Companion — opens files from Sambee in native desktop editors"
authors = []

[lib]
name = "sambee_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "stream", "http2", "system-proxy", "rustls-tls-native-roots", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
mime_guess = "2"

# Local drive management (HTTP API server)
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
notify = "8"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
bzip2 = "0.5"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
unicode-normalization = "0.1"
unicode-casefold = "0.2.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
] }
png = "0.17"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
